<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entry</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/entry.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 data-i18n="entry.header.title"></h1>
        <p data-i18n="entry.header.description"></p>
      </header>

      <div class="actions">
        <button class="redirect" data-i18n="ui.navigation.dashboard"></button>
      </div>

      <form class="expense-form">
        <h2 class="form-title" data-i18n="entry.expense.form.title"></h2>
        <select id="main-category" name="mainCategory" required>
          <option
            value=""
            disabled
            selected
            data-i18n="entry.expense.form.mainCategoryPlaceholder"
          ></option>
        </select>
        <select id="sub-category" name="subCategory" required>
          <option
            value=""
            disabled
            selected
            data-i18n="entry.expense.form.subCategoryPlaceholder"
          ></option>
        </select>
        <input
          id="amount"
          type="number"
          name="amount"
          required
          data-i18n-placeholder="entry.expense.form.amount"
        />
        <input
          id="description"
          type="text"
          name="description"
          data-i18n-placeholder="entry.expense.form.description"
        />
        <input id="payment-date" class="full" type="date" name="paymentDate" required />
        <button
          id="add-expense"
          type="submit"
          data-i18n="entry.expense.form.submit"
        ></button>
      </form>

      <form class="income-form">
        <div class="card-heading full">
          <h2 data-i18n="entry.income.form.title"></h2>
        </div>
        <input
          id="income-title"
          type="text"
          required
          data-i18n-placeholder="entry.income.form.incomeTitle"
        />
        <input
          id="income-amount"
          type="number"
          required
          data-i18n-placeholder="entry.income.form.amount"
        />
        <input id="income-date" class="full" type="date" required />
        <button
          id="add-income"
          type="submit"
          data-i18n="entry.income.form.submit"
        ></button>
      </form>
    </div>
    <script src="js/config.js"></script>
    <script src="js/config.local.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/init.js"></script>
    <script src="js/api.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/entry.js"></script>
  </body>
</html>
