<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Expensetracker</title>
    <link rel="stylesheet" href="css/pages.css">
</head>

<body>
    <div class="auth-wrapper">
        <div class="auth-left">
            <h2>Take control of your finances</h2>
            <ul>
                <li>&#10003 Track your daily expenses</li>
                <li>&#10003See exactly where your money goes</li>
                <li>&#10003Understand your spending habits</li>
                <li>&#10003Keep your budget under control</li>
            </ul>

        </div>

        <div class="auth-right">
            <form>
                <h2>Register</h2>
                <input type="text" class="username" placeholder="Username" required>
                <input type="password" class="password" placeholder="Password" required>
                <input type="password" class="password-confirm" placeholder="Confirm password" required>
                <p class="error-message"></p>
                <button id="submit" type="submit">Sign Up</button>
            </form>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/config.local.js"></script>
    <script src="js/authentication.js"></script>
    <script src="js/api.js"></script>
    <script src="js/UI.js"></script>

</body>

</html>
