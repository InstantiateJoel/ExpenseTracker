<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/edit.css" />
  </head>
  <body>
    <form>
      <div class="expense-section">
        <select id="main-category" name="mainCategory" required>
          <option
            value=""
            disabled
            selected
            data-i18n="entry.expense.form.mainCategoryPlaceholder"
          ></option>
        </select>
        <select id="sub-category" name="subCategory" required>
          <option
            value=""
            disabled
            selected
            data-i18n="entry.expense.form.subCategoryPlaceholder"
          ></option>
        </select>
        <input
          id="amount"
          type="number"
          name="amount"
          required
          data-i18n-placeholder="entry.expense.form.amount"
        />
        <input
          id="description"
          type="text"
          name="description"
          data-i18n-placeholder="entry.expense.form.description"
        />
        <input
          id="payment-date"
          class="full"
          type="date"
          name="paymentDate"
          required
        />
        <button
          id="update-expense"
          type="submit"
          data-i18n="edit.expense.form.submit"
        ></button>
      </div>
      <div class="income-section">
        <input
          id="income-title"
          type="text"
          required
          data-i18n-placeholder="entry.income.form.incomeTitle"
          name="title"
        />
        <input
          id="income-amount"
          type="number"
          required
          data-i18n-placeholder="entry.income.form.amount"
          name="amount"
        />
        <input
          id="income-date"
          class="full"
          type="date"
          name="incomeDate"
          required
        />
        <button
          id="update-income"
          type="submit"
          data-i18n="edit.income.form.submit"
        ></button>
      </div>
    </form>
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/init.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/api.js"></script>
    <script src="js/edit.js"></script>
  </body>
</html>
