<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Expense tracker</title>
    <link rel="icon" href="favicon.png">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="auth">
        <form>
            <h2 data-i18n="auth.login.title"></h2>
            <input type="text" class="username" data-i18n-placeholder="auth.login.username" required>
            <input type="password" class="password" data-i18n-placeholder="auth.login.password"  required>           
            <p class="error-message"></p>            
            <button id="submit" type="submit" data-i18n="auth.login.submit"></button>
            <button type="button" id="lang-toggle" data-i18n="ui.language.toggle"></button>
        </form>
    </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/init.js"></script>
    <script src="js/api.js"></script>
    <script src="js/UI.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/login.js"></script>
    </body>
</html>
