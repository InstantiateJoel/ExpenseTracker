<!doctype html>
<html lang="en">
  <head>

    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/dashboard.css" />
    <title>Dashboard</title>
  </head>
  <body>
    <div class="grid-container">
      <header class="header">

      <div id="transaction-list">
      </div>
    </div>
  </body>
